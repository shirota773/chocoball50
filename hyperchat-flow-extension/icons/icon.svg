<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#gradient)"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Flow Lines (representing flowing comments) -->
  <g opacity="0.9">
    <!-- Top line -->
    <rect x="20" y="30" width="80" height="8" rx="4" fill="white">
      <animate attributeName="x" from="128" to="-80" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Middle line -->
    <rect x="25" y="55" width="65" height="8" rx="4" fill="white" opacity="0.8">
      <animate attributeName="x" from="128" to="-65" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom line -->
    <rect x="30" y="80" width="70" height="8" rx="4" fill="white" opacity="0.9">
      <animate attributeName="x" from="128" to="-70" dur="2.8s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Chat bubble icon -->
  <g transform="translate(40, 45)">
    <path d="M24 0 C10.7 0 0 8.5 0 19 C0 24.5 2.8 29.5 7.3 33 L5 40 L14 36 C17 37 20.4 38 24 38 C37.3 38 48 29.5 48 19 C48 8.5 37.3 0 24 0 Z"
          fill="white" opacity="0.3"/>
  </g>

  <!-- Play button (center) -->
  <circle cx="64" cy="64" r="20" fill="white" opacity="0.9"/>
  <path d="M58 52 L78 64 L58 76 Z" fill="#667eea"/>
</svg>
