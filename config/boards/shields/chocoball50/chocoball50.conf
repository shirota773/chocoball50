# Chocoball50 Configuration

# Japanese duplex matrix kscan driver
CONFIG_ZMK_KSCAN_GPIO_DUPLEX=y

# Increase Bluetooth TX power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep for battery saving
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse/Trackball settings
CONFIG_ZMK_MOUSE=y

# I2C for trackball (now using I2C1 on D12/D13)
CONFIG_I2C=y

# az1uball trackball driver
CONFIG_AZ1UBALL=y
CONFIG_AZ1UBALL_THREAD_PRIORITY=50

# RGB Underglow settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# Encoder settings
# Re-enabled with duplex matrix
CONFIG_EC11=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# USB settings
CONFIG_USB_DEVICE_PRODUCT="Chocoball50"
CONFIG_USB_DEVICE_MANUFACTURER="Custom"
